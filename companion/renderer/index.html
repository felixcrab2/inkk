<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- No Node, no network: everything this page knows comes through
       window.inkk (preload.js). Styles and fonts are local. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none';" />
  <title>inkk</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="root"></main>
  <!-- mock.js defines window.inkk only when it is missing (a plain browser);
       inside the app the preload has already run and it does nothing. -->
  <script src="mock.js"></script>
  <script src="bundle.js"></script>
</body>
</html>
