<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Paper, not black: this is the colour iOS paints around the app when
         added to the Home Screen, so it must match --bg or the safe areas
         show as dark bands. -->
    <meta name="theme-color" content="#faf8f4" />
    <!-- Added to the Home Screen, inkk launches fullscreen with no Safari
         chrome. It is also how the phone app is tested before Xcode exists. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="inkk" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="alternate icon" href="%PUBLIC_URL%/inkk-logo.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/inkk-logo.png" />
    <title>inkk</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
